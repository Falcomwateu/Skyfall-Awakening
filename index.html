<style>

<h1>Skyfall: Awakening<br>Evaluación de perfil</h1>
<p>72 preguntas. Responde con sinceridad lo que harías tú: no hay respuestas correctas. Al terminar, tus respuestas se envían al narrador.</p>
<div class="bar" id="bar">0 / 72 respondidas</div>
<form id="f" novalidate>
<p><label for="nombre" style="padding:0">Nombre de tu jugador o personaje</label><input type="text" id="nombre" maxlength="60" autocomplete="off"></p>
<div id="qs"></div>
<button type="submit" id="go">Enviar respuestas</button>

</form></main>
<script>
// Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec)
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbztE6Aelz6KdTSUnEP-V34FnI445f-yn3YycxtgGT1bHMDiGvwkDiKsbFzVCXD0wRwnNw/exec';
const SECCIONES = [{"t": "SECCIÓN I: ORIGEN Y ENTORNO SOCIOECONÓMICO", "q": [{"n": 1, "p": "¿En qué zona de la región has pasado la mayor parte de tu vida?", "o": ["En los rascacielos y distritos financieros de Aethel City.", "En los barrios industriales y zonas obreras de Gloom Haven.", "En los callejones y redes subterráneas de Gloom Haven.", "He sido nómada, transitando constantemente entre ambas ciudades."]}, {"n": 2, "p": "¿Cuál es tu situación financiera actual?", "o": ["Acomodada/Élite; cuento con recursos, capital o financiación corporativa.", "Estable/Clase media; trabajo duro para cubrir mis necesidades y mi equipo.", "Precaria/Marginal; vivo al día con lo que consigo en las calles.", "Fuera del sistema; no poseo cuentas bancarias ni registros oficiales."]}, {"n": 3, "p": "¿Cómo reacciona tu entorno cercano ante la creciente delincuencia de Gloom Haven?", "o": ["Exigen más tecnología, seguridad privada y control policial.", "Organizan patrullas vecinales y se protegen entre ellos.", "Aceptan el caos como una regla de supervivencia y se adaptan.", "Ven la crisis como una oportunidad para cambiar las reglas del juego."]}, {"n": 4, "p": "¿Qué actitud adoptas frente a las corporaciones de Aethel City (como Aethel Corp)?", "o": ["Son el motor del progreso; alinearse con ellas trae recursos y orden.", "Son males necesarios; útiles para el comercio, pero corruptas en el fondo.", "Son opresoras; la causa directa de la miseria en Gloom Haven.", "Son objetivos a hackear, saquear o desmantelar."]}]}, {"t": "SECCIÓN II: FILOSOFÍA Y MORALIDAD", "q": [{"n": 5, "p": "Si presencias un crimen violento en curso, ¿cuál es tu primera reacción instintiva?", "o": ["Evaluar la situación fríamente y calcular el método más eficiente para intervenir.", "Lanzarme directamente a proteger a la víctima, usando la fuerza si es necesario.", "Moverme desde las sombras, neutralizar al agresor sin ser visto y desaparecer.", "Usar cualquier objeto o recurso del entorno para causar una distracción caótica."]}, {"n": 6, "p": "¿Qué piensas sobre el uso de la fuerza letal contra criminales peligrosos?", "o": ["Inaceptable; destruye la legitimidad moral y nos convierte en lo que combatimos.", "Solo en casos de extrema necesidad para salvar vidas inocentes en peligro inminente.", "Justificada si el criminal demuestra ser una amenaza recurrente e incorregible.", "La fuerza letal es simplemente una herramienta táctica; las reglas las impongo yo."]}, {"n": 7, "p": "¿Cuál es tu postura respecto a la ley y las autoridades oficiales?", "o": ["Trabajar dentro del sistema o colaborar en secreto con oficiales de confianza.", "Respetar el espíritu de la ley, aunque a veces deba romper sus reglas formales.", "Ignorar la ley por completo; la verdadera justicia no cabe en un código legal.", "Desafiar abiertamente a la autoridad cuando esta demuestra ser incompetente o corrupta."]}, {"n": 8, "p": "En una crisis masiva donde no puedes salvar a todos, ¿a quién priorizas?", "o": ["Al grupo más numeroso de personas para maximizar el impacto positivo.", "A los más vulnerables e indefensos que no pueden protegerse por sí mismos.", "A aquellos cuya supervivencia sea estratégicamente vital para detener la amenaza.", "A mis compañeros de equipo o aliados clave antes que a los desconocidos."]}]}, {"t": "SECCIÓN III: AFINIDAD DE PODER Y COMBATE", "q": [{"n": 9, "p": "Si pudieras manifestar o equipar una habilidad principal, ¿cuál preferirías?", "o": ["Proyección de energía limpia, luz hard-light o impulsos electromagnéticos.", "Fuerza física aumentada, densidad corporal o resistencia impenetrable.", "Manipulación de elementos oscuros, sombras, camuflaje o frío extremo.", "Generación de fuego/plasma, ondas de choque o tecnología de combustión."]}, {"n": 10, "p": "¿Cómo prefieres abordar un enfrentamiento táctico?", "o": ["A distancia; analizando patrones y disparando/atacando con precisión matemática.", "En la línea de frente; cuerpo a cuerpo, absorbiendo el castigo y abriendo paso.", "Desde el sigilo; emboscadas rápidas, golpes críticos y retirada inmediata.", "Con potencia de fuego masiva; abrumando al enemigo con explosiones o ráfagas."]}, {"n": 11, "p": "¿Qué tipo de recurso prefieres utilizar en combate?", "o": ["Proyecciones de energía, hologramas o constructos fotónicos.", "Tu propio cuerpo, artes marciales o blindaje físico pesado.", "El entorno oscuro, objetos punzantes, venenos o gas táctico.", "Dispositivos mecánicos, munición especial, drones o explosivos."]}, {"n": 12, "p": "¿Cuál es tu mayor fortaleza en medio del caos?", "o": ["Mantener la mente despejada y diseñar un plan en segundos.", "Una voluntad inquebrantable que me impide rendirme ante el dolor.", "Una paciencia letal para esperar el momento exacto de atacar.", "La capacidad de improvisar y usar el caos a mi favor."]}]}, {"t": "SECCIÓN IV: ROL EN EL EQUIPO", "q": [{"n": 13, "p": "En un grupo de combate o vigilantes, ¿qué rol asumes de manera natural?", "o": ["El estratega/líder que asigna objetivos y coordina los movimientos.", "El escudo/tanque que protege al equipo y atrae la atención del enemigo.", "El explorador/infiltrado que reúne inteligencia y elimina amenazas clave.", "El especialista/artillero que aporta la mayor potencia ofensiva."]}, {"n": 14, "p": "¿Cómo reaccionas cuando un compañero comete un error grave en una misión?", "o": ["Analizo la falla fríamente y ajusto el protocolo para que no vuelva a ocurrir.", "Lo cubro de inmediato para asumir el impacto y evitar que resulte herido.", "Reprendes su falta de disciplina, pero mantienes la cobertura en silencio.", "Expreso mi molestia en el acto, pero busco una solución rápida improvisada."]}, {"n": 15, "p": "¿Qué esperas de tus aliados durante un operativo?", "o": ["Disciplina, comunicación clara y seguimiento estricto del plan.", "Lealtad ciega, valor y disponibilidad para dar la cara por el otro.", "Eficiencia, discreción y que no me estorben en mi trabajo.", "Adaptabilidad, arrojo y capacidad de reaccionar sobre la marcha."]}, {"n": 16, "p": "¿Cuál es la razón principal por la que aceptarías formar parte de un equipo?", "o": ["Porque un grupo coordinado alcanza metas estratégicas imposibles para un solo individuo.", "Para crear una red de apoyo mutuo y proteger a más personas juntos.", "Para dividir tareas y acceder a recursos que en solitario no poseo.", "Porque la unión hace la fuerza frente a un enemigo que nos supera."]}]}, {"t": "SECCIÓN V: PSICOLOGÍA URBANA Y MANEJO DEL ESTRÉS", "q": [{"n": 17, "p": "¿Cómo reaccionas ante la sobrecarga de información durante un combate o crisis urbana?", "o": ["Mi cerebro procesa todo como un flujo de datos; priorizo objetivos por importancia.", "Entro en un estado de enfoque visceral; reduzco mi visión al enemigo que tengo enfrente.", "Me desconecto del ruido exterior y me concentro únicamente en la sombra o el objetivo.", "Dejo que la adrenalina fluya y respondo con violencia rápida a cualquier amenaza."]}, {"n": 18, "p": "¿Qué haces cuando descubres que la policía local está encubriendo a un criminal de alto rango?", "o": ["Recopilo pruebas digitales y las filtro anónimamente a los medios para destruir su credibilidad.", "Confronto directamente a los oficiales corruptos en el acto para detener el encubrimiento.", "Rastreo al criminal en secreto y me encargo de él sin involucrar a las autoridades.", "Saboteo sus operaciones y hago pública la corrupción mediante un acto simbólico desastroso."]}, {"n": 19, "p": "¿Cuál es tu lugar seguro o método para recuperarte tras una misión agotadora?", "o": ["Un laboratorio ordenado o una sala de control rodeado de tecnología e información.", "Un gimnasio, cuadrilátero o taller donde pueda descargar la tensión físicamente.", "Un rincón oscuro e inaccesible en los tejados o túneles de Gloom Haven.", "Un refugio clandestino con música, comida o la compañía de un puñado de leales."]}, {"n": 20, "p": "Si un villano amenaza con destruir un monumento público si no te entregas, ¿qué haces?", "o": ["Analizo el temporizador/estructura para desactivar la amenaza antes de que expire el plazo.", "Me presento en el lugar para llamar su atención y permitir que los civiles evacuen.", "Ignoro el chantaje y utilizo la distracción del villano para atacarlo por la espalda.", "Creo una falsa entrega o señuelo para engañarlo y hacer detonar su propia trampa."]}]}, {"t": "SECCIÓN VI: ORIGEN BIOLÓGICO O TECNOLÓGICO", "q": [{"n": 21, "p": "¿Cómo describirías la fuente original de tus habilidades o tu capacidad de combate?", "o": ["Desarrollo científico, modificación genética deliberada o ingeniería de laboratorio.", "Una mutación latente o rasgo hereditario que despertó repentinamente tras un gran impacto.", "Entrenamiento físico extremo combinado con dispositivos/armamento diseñados por mí.", "Exposición accidental a energía anómala, radiación metahumana o un cataclismo."]}, {"n": 22, "p": "Si tus habilidades provienen de un experimento o tecnología, ¿cuál fue tu grado de control?", "o": ["Voluntario; elegí someterme al proceso o yo mismo construí mi propio equipamiento.", "Involuntario; fui víctima de un proyecto corporativo o un accidente fuera de mi control.", "Oportunista; robé o encontré prototipos tecnológicos y los adapté a mis necesidades.", "Caótico; fue una reacción inesperada que ni los científicos ni yo pudimos predecir."]}, {"n": 23, "p": "¿Qué sientes hacia la fuente de tus poderes o equipamiento?", "o": ["Orgullo; es el pináculo de la evolución humana o la ingeniería moderna.", "Un deber pesado; es una carga con la que debo aprender a convivir diariamente.", "Distancia pragmática; es simplemente una herramienta para lograr mis objetivos.", "Resentimiento o desconfianza; un poder impredecible que puede volverse en mi contra."]}, {"n": 24, "p": "¿Qué ocurre si se te priva de tus poderes o de tu arsenal principal?", "o": ["Recurro a mi intelecto táctico y hackeo el entorno para nivelar la batalla.", "Lucho con mis puños y mi resistencia física hasta el último aliento.", "Me repliego en el sigilo para conseguir suministros improvisados en el campo.", "Utilizo la manipulación, el engaño o explosivos de suerte para causar el mayor caos posible."]}]}, {"t": "SECCIÓN VII: RELACIÓN CON LA LEY Y LA AUTORIDAD", "q": [{"n": 25, "p": "¿Cómo consideras a los héroes o vigilantes que cooperan abiertamente con Aethel Corp o la Policía?", "o": ["Profesionales inteligentes que aprovechan la infraestructura legal para hacer el bien.", "Héroes bienintencionados, pero expuestos a ser manipulados por agendas políticas.", "Vendidos que sacrificaron su libertad a cambio de presupuesto y comodidad.", "Enemigos potenciales o marionetas que protegen el status quo de los ricos."]}, {"n": 26, "p": "Si las autoridades emiten una orden de arresto en tu contra, ¿cuál es tu respuesta?", "o": ["Negocio a través de intermediarios para demostrar mi inocencia o utilidad táctica.", "Permanezco en la ciudad protegiendo a la gente, evitando la captura sin dañar a los agentes.", "Desaparezco por completo de los registros y opero en la clandestinidad absoluta.", "Dejo un mensaje claro y desafiante para demostrar que no pueden atraparme."]}, {"n": 27, "p": "¿Aceptarías un financiamiento anónimo si proviene de una corporación sospechosa?", "o": ["Sí, siempre que pueda rastrear el dinero y usarlo para mis propios objetivos sin ataduras.", "No; aceptar dinero sucio compromete la integridad moral de mi causa.", "Sí, pero investigo simultáneamente a la corporación para chantajearlos si intentan traicionarme.", "Acepto los recursos, los gasto de inmediato en mi equipo y luego ignoro sus órdenes."]}, {"n": 28, "p": "¿Cuál es tu postura sobre el registro obligatorio de metahumanos por parte del gobierno?", "o": ["Necesario para garantizar la seguridad pública y evitar abusos de poder.", "Comprensible en teoría, pero peligroso si la lista cae en manos equivocadas.", "Un acto flagrante de control autoritario que viola la libertad individual.", "Una estupidez que simplemente creará un mercado negro de identidades falsas."]}]}, {"t": "SECCIÓN VIII: EL EVENTO CANÓNICO", "q": [{"n": 29, "p": "¿Qué evento del pasado definió de manera irreversible tu decisión de portar la máscara o el arma?", "o": ["El descubrimiento de un complot o secreto corporativo que cambió mi visión del mundo.", "Una tragedia personal o la pérdida de un ser querido a manos de la delincuencia.", "Un acto de traición que me obligó a abandonar mi vida anterior y empezar desde cero.", "Un accidente traumático donde mi poder o tecnología se descontroló por primera vez."]}, {"n": 30, "p": "¿Cómo afecta ese evento del pasado a tus decisiones actuales?", "o": ["Me impulsa a calcular cada paso para jamás volver a ser tomado por sorpresa.", "Me motiva a actuar como un escudo para que nadie sufra lo que yo sufrí.", "Mantiene mi corazón frío y enfocado exclusivamente en la supervivencia y el resultado.", "Me produce una rabia constante que canalizo contra los criminales en el combate."]}, {"n": 31, "p": "Si te encuentras cara a cara con la persona responsable de tu tragedia pasada, ¿qué haces?", "o": ["Lo sometes, reúnes pruebas contundentes y lo entregas a la justicia para que se pudra en prisión.", "Lo derrotas en combate, pero te niegas a matarlo para no convertirte en él.", "Lo ejecutas en silencio sin dudarlo; la retribución debe ser absoluta.", "Le haces sentir el mismo miedo y caos que te causó antes de decidir su destino."]}, {"n": 32, "p": "¿Qué cicatriz (física o emocional) te dejó tu evento canónico?", "o": ["Una desconfianza analítica hacia cualquier figura de autoridad o promesa de ayuda.", "Un dolor físico o marca en el cuerpo que me recuerda diariamente mi compromiso.", "La incapacidad de conectar emocionalmente con otras personas por miedo a perderlas.", "Una mente inquieta que no puede permanecer en calma ni un solo segundo."]}]}, {"t": "SECCIÓN IX: ENTORNO OPERACIONAL Y BASES DE OPERACIONES", "q": [{"n": 33, "p": "¿Qué tipo de refugio o base de operaciones prefieres para tu equipo o para ti?", "o": ["Un piso de alta tecnología en un rascacielos de Aethel City con acceso a satélites y servidores.", "Un almacén o taller remodelado en el distrito industrial de Gloom Haven, práctico y discreto.", "Una red de bunkers subterráneos inaccesibles ocultos en las alcantarillas o túneles olvidados.", "Múltiples pisos francos temporales y cambiantes repartidos por toda la región."]}, {"n": 34, "p": "¿Cómo te desplazas por la metrópolis durante una patrulla nocturna?", "o": ["Utilizando un vehículo de alta tecnología, planeadores fotónicos o capacidades de vuelo.", "Cruzando los tejados con ganchos de salto, agilidad física o motocicletas modificadas.", "Moviéndote por la sombra de los callejones, pasajes de servicio y redes de ventilación.", "Modificando el transporte público/industrial o irrumpiendo a alta velocidad con potencia."]}, {"n": 35, "p": "¿Cuál es tu estrategia cuando debes operar en un territorio completamente desconocido?", "o": ["Hackeo las cámaras de tráfico y mapas de la zona para tener un modelo 3D antes de entrar.", "Realizo un reconocimiento a pie, hablando con residentes locales para entender las calles.", "Me infiltro en silencio durante la noche para ubicar salidas de emergencia y puntos ciegos.", "Entro con fuerza para provocar una reacción y evaluar la respuesta defensiva del enemigo."]}, {"n": 36, "p": "¿Qué recurso es indispensable en tu centro de mando?", "o": ["Supercomputadoras, pantallas de diagnóstico y bases de datos criminales actualizadas.", "Una armería bien provista, banco de entrenamiento físico y suministros médicos.", "Monitores de escucha de frecuencia policial, escáneres y rutas de escape secundarias.", "Equipamiento de fabricación artesanal, impresoras 3D y componentes de repuesto."]}]}, {"t": "SECCIÓN X: DINÁMICA DE EQUIPO Y CONFISCACIÓN DE RECURSOS", "q": [{"n": 37, "p": "Durante una incursión en una base enemiga, encuentran una fuente de energía/tecnología altamente peligrosa. ¿Qué propones hacer?", "o": ["Asegurarla en un contenedor blindado para estudiarla en nuestro laboratorio bajo protocolos estrictos.", "Destruirla de inmediato para garantizar que nadie pueda usarla jamás como arma.", "Confiscarla en secreto para usarla como carta del triunfo contra futuros villanos.", "Desmantelarla en piezas para mejorar nuestras propias armas y equipos individuales."]}, {"n": 38, "p": "¿Cómo manejas la recarga o el mantenimiento de tu equipamiento/poderes entre misiones?", "o": ["Sigo una rutina estricta de mantenimiento preventivo y diagnósticos de energía.", "Soporto el desgaste corporal o mental hasta que el descanso físico natural me recupere.", "Consigo piezas de repuesto o insumos de manera clandestina en el mercado negro.", "Improviso reparaciones con lo que tenga a la mano, sin importar la estética mientras funcione."]}, {"n": 39, "p": "Si un compañero sugiere aliarse temporalmente con un sindicato criminal para derrocar a un villano mayor, ¿cuál es tu voto?", "o": ["A favor, solo si establecemos salvaguardas tácticas y un plan para traicionarlos después.", "En contra; aliarse con criminales destruye la confianza del pueblo e invalida nuestra causa.", "A favor; el enemigo de mi enemigo es una herramienta útil si se maneja con cuidado.", "A favor, siempre y cuando la alianza nos dé acceso a su armamento y territorio."]}, {"n": 40, "p": "¿Qué actitud tomas si el grupo entra en una disputa por el liderazgo del equipo?", "o": ["Propongo un sistema de votación basado en datos y méritos estratégicos demostrados.", "Intervengo como mediador para recordarles que la misión y la gente están primero.", "Me mantengo al margen; el verdadero líder se demuestra en el campo de batalla, no discutiendo.", "Desafío la autoridad de quien intente mandarme si considero que su plan es mediocre."]}]}, {"t": "SECCIÓN XI: ESTILO DE COMBATE Y MATRIZ DE DEFENSA", "q": [{"n": 41, "p": "¿Cuál es tu filosofía principal cuando un enemigo lanza un ataque masivo contra ti?", "o": ["Desviar el ataque mediante campos de fuerza, barreras de luz o anulación de energía.", "Absorber el impacto con mi blindaje o masa corporal y devolver un golpe el doble de fuerte.", "Esquivar el ataque por completo usando agilidad, reflejos o desaparición en las sombras.", "Interceptar el ataque lanzando un proyectil o explosión opuesta para neutralizarlo en el aire."]}, {"n": 42, "p": "¿Qué tipo de daño prefieres infligir en tus oponentes para neutralizarlos?", "o": ["Incapacitación sistémica: parálisis neural, cegueras temporales o aturdimiento.", "Traumatismo físico: contusiones, llaves de sumisión o fracturas mecánicas.", "Ataques de precisión: cortes en puntos vitales, presión arterial o asfixia táctica.", "Daño por área: quemaduras de plasma, sobrecargas eléctricas o concusiones por onda expansiva."]}, {"n": 43, "p": "¿Cómo enfrentas a un enemigo que supera con creces tus capacidades físicas o tu poder?", "o": ["Estudio su estilo durante los primeros minutos para encontrar una falla lógica en su patrón.", "Resistir sus embates, desgastarlo por atrición y aprovechar su exceso de confianza.", "Usar señuelos, entorno a mi favor y ataques relámpago de \"golpea y huye\".", "Sobrecargar mi equipamiento/poder al límite para asestar un único golpe devastador."]}, {"n": 44, "p": "En una pelea en un espacio cerrado y lleno de civiles, ¿cuál es tu primera acción?", "o": ["Crear una barrera de contención o distracción luminosa para evacuar a la multitud.", "Colocarme físicamente entre el enemigo y los rehenes para recibir los disparos.", "Eliminar la fuente de luz o crear humo para desorientar al villano y atacar desde arriba.", "Provocar al enemigo para que me siga hacia el exterior, fuera del alcance de los inocentes."]}]}, {"t": "SECCIÓN XII: LÍMITES FISIOLÓGICOS Y TRAMPAS DEL SISTEMA", "q": [{"n": 45, "p": "¿Cuál es la mayor consecuencia o \"efecto secundario\" de llevar tus habilidades o tecnología al límite?", "o": ["Sobrecarga mental, migrañas severas o pérdida temporal de la visión/procesamiento.", "Agotamiento físico extremo, desgacres musculares o daño estructural óseo.", "Pérdida de control emocional, paranoia o desconexión progresiva de mi humanidad.", "Fallas mecánicas, riesgo de explosión de baterias/insumos o retroceso destructivo."]}, {"n": 46, "p": "¿Qué ocurre cuando te encuentras al borde de la inconsciencia y la derrota total?", "o": ["Mi mente busca el último recurso lógico o protocolo de autodestrucción/escape.", "Siento una descarga final de adrenalina que me permite dar un último golpe desesperado.", "Me fundo con las sombras o activo un camuflaje de emergencia para desaparecer.", "Libero toda la energía o munición restante en un estallido caótico a mi alrededor."]}, {"n": 47, "p": "¿Qué tipo de amenaza consideras como tu \"punto ciego\" o mayor debilidad en el campo?", "o": ["Ataques cibernéticos, interferencias electromagnéticas o ilusiones mentales.", "Armamento de alto calibre perforante, toxinas biológicas o corrosivos.", "Sensores térmicos de alta definición, detectores de movimiento o luz cegadora masiva.", "Espacios estrechos sin cobertura o la falta de componentes/suministros de repuesto."]}, {"n": 48, "p": "¿Cómo manejas el miedo cuando enfrentas una amenaza de escala apocalíptica o cataclísmica?", "o": ["Convierto el miedo en cálculo; las probabilidades nunca son cero si hay un plan.", "Acepto el miedo y lo transformo en coraje para estar al frente sin dar un paso atrás.", "El miedo es un sensor; me indica que debo ser más letal, precavido y silencioso.", "Me río del peligro; si el mundo se va a acabar, me aseguraré de pelear salvajemente."]}]}, {"t": "SECCIÓN XIII: EL CAMINO DEL VIGILANTE", "q": [{"n": 49, "p": "¿Qué significa para ti cruzar la línea entre ser un ciudadano común y convertirse en un vigilante?", "o": ["Un deber moral inevitable; si tienes la capacidad de actuar y no lo haces, la culpa es tuya.", "Una necesidad táctica; la ley tiene las manos atadas por la burocracia y alguien debe hacer el trabajo sucio.", "Un sacrificio personal; renunciar a una vida normal a cambio de proteger a los inocentes.", "Un acto de rebelión contra un sistema corrupto que ya no representa a la sociedad."]}, {"n": 50, "p": "¿Cómo reaccionas si la prensa o las autoridades te etiquetan públicamente como una amenaza o un criminal?", "o": ["Ignoro la narrativa pública; los resultados en las calles y las vidas salvadas hablan por sí solos.", "Utilizo la infamia como un arma disuasoria; si los villanos me temen y la policía me respeta por miedo, mejor.", "Trabajo de forma metódica para limpiar mi nombre demostrando honor y transparencia en mis actos.", "Me adapto y desaparezco aún más en las sombras; cuanto menos sepan la verdad, más seguro opero."]}, {"n": 51, "p": "En una patrulla nocturna típica, ¿cuál es tu prioridad principal al recorrer la ciudad?", "o": ["Recopilar información, espiar redes de tráfico e interceptar planes antes de que se ejecuten.", "Intervenir en robos, asaltos violentos y crímenes en curso en los barrios más peligrosos.", "Rastrear la actividad de supervillanos o metahumanos peligrosos que la policía no pueda manejar.", "Garantizar que las zonas civiles vulnerables permanezcan seguras sin llamar la atención."]}, {"n": 52, "p": "¿Cuál de los siguientes principios morales es inquebrantable para ti, sin importar las circunstancias?", "o": ["Jamás arriesgar la vida de un inocente para atrapar a un objetivo.", "Jamás rendirme ni retroceder cuando alguien depende de mi protección.", "Jamás usar mis habilidades para el beneficio o enriquecimiento personal.", "Jamás permitir que nadie controle mi libertad o mis decisiones."]}, {"n": 53, "p": "¿Cómo manejas la carga psicológica de ver la violencia y miseria de la ciudad noche tras noche?", "o": ["Analizando los problemas desde una perspectiva fría y objetiva para no quemarme emocionalmente.", "Canalizando la frustración en entrenamiento físico duro y disciplina personal.", "Buscando momentos de desconexión total con personas de confianza o actividades cotidianas.", "Aceptando la oscuridad de la ciudad como parte del mundo y adaptando mi carácter a ella."]}]}, {"t": "SECCIÓN XIV: APRENDIZAJE Y TUTORÍA", "q": [{"n": 54, "p": "Si pudieras elegir qué tipo de mentor te instruya en tus primeros pasos, ¿cuál preferirías?", "o": ["Un estratega brillante o científico veterano que me enseñe análisis, tecnología y control.", "Un combatiente experimentado y curtido en mil batallas que exija disciplina física y temple.", "Un ex-vigilante de las sombras que me enseñe infiltración, sigilo y psicología del miedo.", "Un metahumano con un poder similar al mío que me ayude a desatar mi verdadero potencial sin reservas."]}, {"n": 55, "p": "¿Qué actitud adoptas cuando tu mentor te ordena retirarte de una misión por tu propia seguridad?", "o": ["Obedezco si su lógica es sólida, pero analizo la situación para aprender del retiro.", "Desobedezco la orden si siento que mi presencia puede cambiar el resultado o salvar su vida.", "Acato la orden a regañadientes, pero me mantengo en reserva cerca por si las cosas colapsan.", "Discuto la orden en el acto si creo que está equivocado; no sigo órdenes a ciegas."]}, {"n": 56, "p": "¿Cuál es el mayor aprendizaje que esperas obtener durante tu periodo de \"sidekick\" o aprendiz?", "o": ["Dominar los recursos, la tecnología y el control táctico del entorno.", "Fortalecer mi espíritu y saber resistir la derrota sin quebrarme.", "Comprender la mente de los villanos para ir un paso adelante.", "Aprender a trabajar en equipo sin perder mi propia identidad."]}, {"n": 57, "p": "Si tu mentor es capturado o incapacitado, ¿cuál es tu movimiento inmediato?", "o": ["Ejecutar el protocolo de emergencia que trazamos previamente y tomar el control del operativo.", "Lanzarme de inmediato al rescate antes de que sea demasiado tarde, sin importar los riesgos.", "Rastrear a los captores desde las sombras y preparar una emboscada quirúrgica.", "Solicitar refuerzos o apoyarme en mis compañeros para montar un contraataque coordinado."]}, {"n": 58, "p": "¿Cuándo sabrás que ha llegado el momento de dejar de ser un aprendiz y graduarte?", "o": ["Cuando sea capaz de superar tácticamente las decisiones de mi mentor en el campo.", "Cuando enfrente y supere por mí mismo mi propio evento canónico sin colapsar.", "Cuando inspire a otros a seguirme o salvar vidas por mi propia cuenta.", "Cuando mi mentor me mire a los ojos y reconozca que ya no tiene nada más que enseñarme."]}]}, {"t": "SECCIÓN XV: EL CULMEN Y EL MAÑANA", "q": [{"n": 59, "p": "Si en el futuro tu grupo decide tomar un rumbo oscuro y actuar como villanos o antihéroes despiadados, ¿qué harás?", "o": ["Enfrentarlos para detenerlos; los principios y la justicia están por encima de la amistad.", "Intentar hacerlos entrar en razón desde dentro; jamás abandonaría a mis hermanos de armas.", "Apartarme del equipo y seguir mi propio camino en solitario.", "Evaluar si tienen razón; si el mundo está tan podrido que requiere medidas extremas, me adapto."]}, {"n": 60, "p": "¿Qué tipo de legado te gustaría dejar en Aethel City o Gloom Haven al final de tu carrera?", "o": ["Un símbolo de orden, progreso y tecnología que guíe a las futuras generaciones.", "Un escudo inquebrantable que demostró que un grupo de individuos puede cambiar el destino.", "Un mito aterrador que mantenga a los criminales a raya por generaciones.", "La prueba viva de que cualquiera, sin importar su origen, puede tomar el control de su propia vida."]}, {"n": 61, "p": "¿Cómo te gustaría que se llamara o se definiera la alianza final que formen tus compañeros?", "o": ["Una fuerza táctica de vanguardia destinada a proteger la paz global.", "Una hermandad inquebrantable nacida de las cenizas y el sacrificio.", "Un pacto de las sombras para erradicar el mal que la ley no puede tocar.", "Una liga libre de héroes independientes que responden únicamente a la necesidad del pueblo."]}, {"n": 62, "p": "Si tu evento canónico te obligara a elegir entre salvar tu propia humanidad o salvar la ciudad, ¿qué elegirías?", "o": ["Sacrificaría mi humanidad/paz si eso garantiza la supervivencia de la ciudad.", "Lucharía hasta la muerte por encontrar una forma de conservar ambas.", "Priorizaría conservar la integridad moral; destruirlo todo para ganar no es ganar.", "Aceptaría la monstruosidad con tal de proteger a quienes amo."]}, {"n": 63, "p": "En el fondo de tu corazón, ¿qué buscas realmente detrás de la máscara?", "o": ["Respuestas sobre quién soy y cuál es mi verdadero potencial.", "Proteger a otros del dolor que yo mismo tuve que sufrir en el pasado.", "Redención por los errores y fallas de mi vida anterior.", "Demostrarme a mí mismo que no soy un observador impotente en este mundo."]}, {"n": 64, "p": "Si pudieras definir la esencia de tu historia en una sola palabra, ¿cuál sería?", "o": ["Evolución.", "Voluntad.", "Destino.", "Libertad."]}, {"n": 65, "p": "La tormenta ha comenzado sobre Aethel City y Gloom Haven. ¿Estás listo para el despertar?", "o": ["Mi mente está despejada y los planes trazados. Que empiece el Awakening.", "Que venga lo que sea; no daré un solo paso atrás.", "Estoy en las sombras esperando el momento perfecto para actuar.", "Nací listo. Las reglas han cambiado."]}, {"n": 66, "p": "Ante la revelación de un secreto gubernamental de alto nivel, ¿cuál es tu primera prioridad?", "o": ["Analizar el impacto global y calcular cómo neutralizar la amenaza sin cundir el pánico.", "Proteger a las personas directamente afectadas por el secreto.", "Exponer la información inmediatamente para que el público sepa la verdad.", "Usar el secreto como apalancamiento estratégico contra las autoridades."]}, {"n": 67, "p": "Si descubres que un villano actúa impulsado por un trauma similar al tuyo, ¿cómo abordas la situación?", "o": ["Mantengo el profesionalismo; el trauma no justifica sus acciones criminales.", "Intento razonar con él durante el combate para ofrecerle una oportunidad de rendición.", "Utilizo su trauma en su contra para desestabilizarlo emocionalmente y neutralizarlo.", "Me enfoco en desarmarlo rápidamente sin entrar en debates filosóficos."]}, {"n": 68, "p": "¿Qué relación mantienes con la tecnología de rastreo y vigilancia en la ciudad?", "o": ["La utilizo a mi favor integrando sus feeds de datos a mis sistemas personales.", "La tolero mientras no invada la privacidad de los inocentes.", "La evito activamente mediante métodos de distorsión y bloqueo de señal.", "La saboteo en mi zona de operaciones para mantener el control total del territorio."]}, {"n": 69, "p": "En una situación de toma de rehenes en Aethel Corp, ¿cuál es tu plan de entrada?", "o": ["Hackear los planos de ventilación y sistemas de seguridad para una entrada quirúrgica.", "Irrumpir por la puerta principal para concentrar todo el fuego enemigo en mí.", "Infiltrarme por las sombras de los niveles inferiores eliminando guardias en silencio.", "Crear una brecha explosiva en un punto ciego para generar confusión masiva."]}, {"n": 70, "p": "¿Qué valoras más en un equipamiento o arma personal?", "o": ["Su precisión, versatilidad tecnológica y capacidad de adaptación.", "Su durabilidad, resistencia y fiabilidad bajo condiciones extremas.", "Su capacidad de ocultación, letalidad y silencio al ser desplegada.", "Su potencia bruta, capacidad de daño e impacto disuasorio."]}, {"n": 71, "p": "Si la ciudad entra en un estado de ley marcial, ¿cuál es tu comportamiento en las calles?", "o": ["Mantener un perfil bajo recopilando inteligencia sobre los patrones de patrulla.", "Continuar protegiendo a los civiles frente a los abusos tanto de criminales como de las fuerzas armadas.", "Atacar los puestos de control militares de forma clandestina para debilitar el cerco.", "Desafiar abiertamente el toque de queda para demostrar que la ciudad no está bajo control."]}, {"n": 72, "p": "¿Qué determina el éxito final de tu misión al terminar la noche?", "o": ["El cumplimiento de los objetivos estratégicos establecidos con cero margen de error.", "Que todos los inocentes estén a salvo y mis compañeros regresen con vida.", "Que la amenaza haya sido eliminada por completo desde las raíces.", "Haber cambiado las reglas del juego y dejado una marca clara en el enemigo."]}]}];
const L = 'ABCD', qs = document.getElementById('qs');
SECCIONES.forEach(s => {
  const h = document.createElement('h2'); h.textContent = s.t; qs.appendChild(h);
  s.q.forEach(q => {
    const fs = document.createElement('fieldset'); fs.id = 'f' + q.n;
    const lg = document.createElement('legend'); lg.textContent = q.n + '. ' + q.p; fs.appendChild(lg);
    q.o.forEach((t, i) => {
      const lb = document.createElement('label'), r = document.createElement('input');
      r.type = 'radio'; r.name = 'q' + q.n; r.value = L[i];
      lb.append(r, document.createTextNode(L[i] + ') ' + t)); fs.appendChild(lb);
    });
    qs.appendChild(fs);
  });
});
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
const leer = () => Array.from({length: 72}, (_, i) => { const c = f.querySelector('input[name=q' + (i + 1) + ']:checked'); return c ? c.value : null; });
f.addEventListener('change', () => { document.getElementById('bar').textContent = leer().filter(Boolean).length + ' / 72 respondidas'; });
f.addEventListener('submit', async e => {
  e.preventDefault(); msg.className = ''; msg.textContent = '';
  const nombre = document.getElementById('nombre').value.trim();
  if (!nombre) { msg.className = 'err'; msg.textContent = 'Escribe tu nombre.'; document.getElementById('nombre').focus(); return; }
  const r = leer(), i = r.indexOf(null);
  document.querySelectorAll('.falta').forEach(x => x.classList.remove('falta'));
  if (i >= 0) {
    const fs = document.getElementById('f' + (i + 1)); fs.classList.add('falta'); fs.scrollIntoView({block: 'center'});
    msg.className = 'err'; msg.textContent = 'Falta responder la pregunta ' + (i + 1) + ' (y ' + (r.filter(x => !x).length - 1) + ' más).'; return;
  }
  go.disabled = true; msg.textContent = 'Enviando...';
  try {
    await fetch(URL_SCRIPT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({nombre: nombre, respuestas: r})});
    f.innerHTML = '<h2>Respuestas enviadas</h2><p>Gracias, ' + nombre.replace(/[<>&]/g, '') + '. Tu narrador ya recibió tu perfil. Puedes cerrar esta página.</p>';
  } catch (err) { go.disabled = false; msg.className = 'err'; msg.textContent = 'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.'; }
});
</script></body></html>
